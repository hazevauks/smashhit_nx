# The game's one module: Mediocre's engine with the game, Lua, libpng, libjpeg,
# the GameActivity glue and libc++ linked in. (libcrashlytics*.so and
# libdatastore_shared_counter.so are the crash reporter's and Jetpack's and
# are not loaded.)
MODULES libsmashhit.so

# libm and libc functions whose bionic and newlib ABIs agree (softfp, no
# struct, no FILE, no errno above 34) and that the runtime's own list lacks.
PASSTHROUGH ceil ceilf floor floorf rint rintf ldexpf atof atoll rand srand wcsncpy wcstok

# libc++abi's thread_local destructors: weak, tested for NULL (it then keeps
# its own list).
WEAK_NULL __cxa_thread_atexit_impl libc++abi's hook; weak, tested for NULL
